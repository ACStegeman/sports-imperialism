<meta charset="utf-8">
<title>NFL Imperialism</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: the map is the field, a sideline panel holds the wheel and the play-by-play. Single dark "turf + chalk" look, by choice. */
:root {
  --turf: #10201b;
  --turf-2: #172c25;
  --turf-3: #21392f;
  --chalk: #eef2ea;
  --chalk-dim: #a9b8ae;
  --line: rgba(238,242,234,.7);
  --blank: #34483f;
  --gold: #f0b429;
  --danger: #e5484d;
  --display: "Saira Condensed", "Arial Narrow", sans-serif;
  --body: "Inter", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--turf); color: var(--chalk); font-family: var(--body); }
.app {
  display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px;
  padding-block: 16px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1500px; margin: 0 auto;
}
@media (max-width: 960px) { .app { grid-template-columns: minmax(0, 1fr); } .field { position: static; } }
header { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 4vw, 44px); letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1; }
h1 span { color: var(--gold); }
.tally { font-family: var(--display); font-size: 18px; color: var(--chalk-dim); letter-spacing: .06em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.field { min-width: 0; align-self: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); background: var(--turf-2); border-radius: 14px; padding: 8px; position: relative; }
#map { width: 100%; height: auto; display: block; }
.region { transition: fill .5s ease, stroke .5s ease; cursor: default; }
.split-line { fill: none; stroke: var(--line); stroke-width: .6; stroke-dasharray: 3 2; pointer-events: none; }
.borders { fill: none; stroke: var(--line); stroke-width: 1; stroke-linecap: round; pointer-events: none; }
.outline { fill: none; stroke: var(--chalk); stroke-width: 1.2; pointer-events: none; }
.assigning .region { cursor: crosshair; }
.region.target { stroke: var(--gold); stroke-width: 3; animation: pulse 0.9s ease-in-out infinite alternate; }
@keyframes pulse { from { stroke-opacity: 1 } to { stroke-opacity: .25 } }
.logo { pointer-events: none; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.6)); }
.aim { stroke: var(--gold); stroke-width: 2; stroke-dasharray: 6 4; fill: none; pointer-events: none; }
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--turf-2); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.label { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--chalk-dim); margin: 0; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--turf); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { background: transparent; color: var(--chalk-dim); border: 0; border-radius: 8px; padding: 8px 4px; font: 600 13px var(--body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--turf-3); color: var(--chalk); box-shadow: inset 0 0 0 1px var(--line); }
.wheel-wrap { position: relative; width: 100%; max-width: 300px; margin: 0 auto; aspect-ratio: 1; }
.wheel-wrap svg { width: 100%; height: 100%; display: block; }
.pointer { position: absolute; left: 50%; top: -4px; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid var(--gold); filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); z-index: 2; }
.btn { appearance: none; border: 0; border-radius: 10px; padding: 12px 16px; font: 800 18px var(--display); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; background: var(--gold); color: #1d1503; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--chalk); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.danger { background: var(--danger); color: #fff; }
.btn:focus-visible, .seg button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.matchup { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
.side-team { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 10px; transition: background .12s, transform .12s; }
.side-team img { width: 64px; height: 64px; background: var(--chalk); border-radius: 50%; padding: 8px; box-sizing: border-box; }
.side-team .nm { font: 600 13px var(--body); }
.side-team .pct { font: 800 20px var(--display); color: var(--gold); font-variant-numeric: tabular-nums; }
.side-team.lit { background: var(--turf-3); transform: scale(1.06); }
.side-team.win { background: var(--gold); color: #1d1503; }
.side-team.win .pct { color: #1d1503; }
.vs { font: 800 22px var(--display); color: var(--chalk-dim); }
.status { font-size: 15px; line-height: 1.45; margin: 0; min-height: 1.45em; }
.status b { color: var(--gold); font-weight: 600; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 120px; }
select, input[type=number] { background: var(--turf); color: var(--chalk); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: 500 14px var(--body); }
select { width: 100%; }
.hint { font-size: 13px; color: var(--chalk-dim); margin: 0; line-height: 1.4; }
.standings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.standings li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
.standings img, .strengths img { width: 22px; height: 22px; background: var(--chalk); border-radius: 50%; padding: 2px; box-sizing: border-box; }
.standings .n { font-variant-numeric: tabular-nums; color: var(--chalk-dim); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--chalk-dim); max-height: 180px; overflow-y: auto; }
.log li b { color: var(--chalk); font-weight: 600; }
details summary { cursor: pointer; }
.strengths { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 10px; max-height: 320px; overflow-y: auto; padding-right: 4px; }
.strengths label { display: grid; grid-template-columns: 22px 1fr 64px; gap: 8px; align-items: center; font-size: 13px; }
.overlay { position: fixed; inset: 0; background: rgba(6,14,11,.82); display: grid; place-items: center; z-index: 20; padding: 24px; }
.overlay .champ { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.overlay img { width: min(220px, 50vw); height: auto; background: var(--chalk); border-radius: 50%; padding: 24px; box-sizing: border-box; }
.overlay h2 { font: 800 clamp(32px, 6vw, 64px)/1 var(--display); text-transform: uppercase; margin: 0; letter-spacing: .03em; }
.overlay p { margin: 0; color: var(--chalk-dim); font-size: 16px; }
.game { width: min(520px, 100%); background: var(--turf-2); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.board { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; background: #0a1411; border-radius: 12px; padding: 12px; }
.bt { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 8px; border-radius: 8px; padding: 4px 6px; }
.bt img { width: 40px; height: 40px; background: var(--chalk); border-radius: 50%; padding: 4px; box-sizing: border-box; }
.bt span { font: 600 14px var(--body); }
.bt b { font: 800 34px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--gold); }
.bt.won { background: var(--gold); color: #1d1503; } .bt.won b { color: #1d1503; }
.clock { display: flex; flex-direction: column; align-items: center; font: 800 16px var(--display); letter-spacing: .08em; color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
.gfield { width: 100%; height: auto; border-radius: 8px; display: block; }
.plays { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; min-height: 6.5em; }
.plays .q { color: var(--chalk-dim); font-variant-numeric: tabular-nums; margin-right: 6px; font-size: 12px; }
.plays b { color: var(--gold); }
@media (max-width: 480px) { .bt { grid-template-columns: 32px auto; } .bt span { display: none; } .bt img { width: 32px; height: 32px; } }
.upset { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.upset img { width: 90px; height: 90px; background: var(--chalk); border-radius: 50%; padding: 10px; box-sizing: border-box; grid-area: 1 / 1; transform: translateY(-62px); }
.upset span { grid-area: 1 / 1; font: 800 clamp(48px, 9vw, 96px)/1 var(--display); color: var(--gold); letter-spacing: .04em; transform: rotate(-6deg) translateY(30px); text-shadow: 0 4px 0 #1d1503, 0 0 30px rgba(0,0,0,.7); }
.upset.pop { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes pop { from { transform: scale(.3); opacity: 0 } to { transform: scale(1); opacity: 1 } }
.field.shake { animation: shake .55s ease-in-out; }
@keyframes shake { 0%,100% { transform: none } 15% { transform: translate(-8px, 3px) rotate(-.6deg) } 30% { transform: translate(7px, -4px) rotate(.5deg) } 45% { transform: translate(-6px, 2px) } 60% { transform: translate(5px, -2px) } 80% { transform: translate(-2px, 1px) } }
.confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 30; }
.log .up { color: var(--gold); }
.auto { display: flex; gap: 8px; align-items: center; }
.auto .btn { flex: 1; padding: 9px 12px; font-size: 15px; }
.speed { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--chalk-dim); }
.speed select { width: auto; padding: 7px; }
.toggle { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; cursor: pointer; }
.toggle input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--gold); }
.toggle span { font-size: 13px; color: var(--chalk-dim); line-height: 1.4; }
.toggle b { display: block; color: var(--chalk); font-size: 14px; font-weight: 600; }
.records { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.records li { display: flex; flex-direction: column; gap: 1px; }
.records span { color: var(--chalk-dim); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
.records b { font-weight: 600; }
.records.final { margin-top: 12px; text-align: left; }
.replay-row { display: flex; align-items: center; gap: 10px; }
.replay-row .btn { padding: 8px 14px; font-size: 15px; }
input[type=range] { width: 100%; accent-color: var(--gold); }
.side-team .tag { font: 700 11px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--chalk-dim); }
.side-team.win .tag { color: #1d1503; }
.bt span small { display: block; font-size: 10px; letter-spacing: .1em; color: var(--chalk-dim); }
.bt.won span small { color: #1d1503; }
.capital { fill: var(--gold); stroke: #1d1503; stroke-width: 1; stroke-linejoin: round; pointer-events: auto; }
.strengths label.wl { grid-template-columns: 22px 1fr 46px 8px 46px 34px; }
.strengths .dash { color: var(--chalk-dim); text-align: center; }
.strengths output { font-variant-numeric: tabular-nums; color: var(--gold); text-align: right; font-weight: 600; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--chalk-dim); }
@media (prefers-reduced-motion: reduce) { .region { transition: none; } .region.target { animation: none; } }
</style>

<div class="app">
  <header>
    <h1>NFL <span>Imperialism</span></h1>
    <div class="tally" id="tally"></div>
  </header>

  <div class="field" id="field">
    <svg id="map" viewBox="0 0 975 610" role="img" aria-label="Map of the United States colored by NFL team territory"></svg>
    <div class="loading" id="loading">Loading map…</div>
    <div class="upset" id="upset" hidden></div>
  </div>

  <aside class="side">
    <section class="card">
      <p class="label">Battle mode</p>
      <div class="seg" role="group" aria-label="Battle mode">
        <button id="mode-pick" data-mode="pick">Pick winner</button>
        <button id="mode-fifty" data-mode="fifty">50 / 50</button>
        <button id="mode-weighted" data-mode="weighted">Weighted</button>
      </div>
    </section>

    <section class="card" id="turn">
      <div class="wheel-wrap"><div class="pointer"></div><svg id="wheel" viewBox="0 0 300 300"></svg></div>
      <p class="status" id="status"></p>
      <div id="matchup"></div>
      <div class="row" id="actions"></div>
      <div class="auto">
        <button class="btn ghost" id="auto-btn">Auto-play</button>
        <label class="speed">Speed
          <select id="auto-speed" aria-label="Auto-play speed"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option><option value="8">8×</option></select>
        </label>
      </div>
      <p class="hint" id="auto-hint" hidden>Auto-play works in 50 / 50 and Weighted mode.</p>
    </section>

    <section class="card">
      <p class="label">Options</p>
      <label class="toggle"><input type="checkbox" id="opt-sound"><span><b>Sound</b>Whistle, crowd and horn during games.</span></label>
      <label class="toggle"><input type="checkbox" id="opt-capitals"><span><b>Capitals</b>A battle wins only the state fought over. Take a team's capital (the star) and you take everything.</span></label>
      <label class="toggle"><input type="checkbox" id="opt-rebellions"><span><b>Rebellions</b>Each turn, a knocked-out team has a small chance to rise up and retake its home state.</span></label>
    </section>

    <section class="card">
      <p class="label">Hand land to a team</p>
      <select id="assign" aria-label="Team that gets the state you click"></select>
      <p class="hint">Pick a team, then click any state on the map to give it to them.</p>
    </section>

    <section class="card">
      <p class="label">Biggest empires</p>
      <ol class="standings" id="standings"></ol>
    </section>

    <section class="card">
      <p class="label">Play-by-play</p>
      <ul class="log" id="log"></ul>
    </section>

    <section class="card">
      <p class="label">Record book</p>
      <ul class="records" id="records"></ul>
    </section>

    <section class="card">
      <p class="label">Replay</p>
      <input type="range" id="replay-slider" min="0" max="0" value="0" aria-label="Replay position">
      <div class="replay-row"><button class="btn ghost" id="replay-play">Play</button><span class="hint" id="replay-label"></span></div>
      <button class="btn" id="replay-exit" hidden>Back to game</button>
    </section>

    <section class="card">
      <details>
        <summary class="label">Team strength (weighted mode)</summary>
        <label class="toggle" style="margin-top:10px"><input type="checkbox" id="opt-records"><span><b>Set from real records</b>Type each team's wins and losses. Strength = 1 + 9 × win %.</span></label>
        <div class="strengths" id="strengths"></div>
      </details>
    </section>

    <section class="card">
      <button class="btn ghost" id="reset">Reset map</button>
    </section>
  </aside>
</div>
<div class="overlay" id="overlay" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>

<script>
// lat/lon = split seed (real city, nudged so split states divide the way the game is played)
const TEAMS = [

  { abbr: 'sea', name: 'Seattle Seahawks',      color: '#002244', color2: '#69BE28', lat: 47.60, lon: -122.33, state: 'WA', strength: 8 },
  { abbr: 'tb',  name: 'Tampa Bay Buccaneers',  color: '#D50A0A', color2: '#34302B', lat: 27.98, lon: -82.50,  state: 'FL', strength: 6 },
  { abbr: 'ten', name: 'Tennessee Titans',      color: '#4B92DB', color2: '#0C2340', lat: 36.17, lon: -86.77,  state: 'TN', strength: 2 },
  { abbr: 'wsh', name: 'Washington Commanders', color: '#5A1414', color2: '#FFB612', lat: 39.00, lon: -77.70,  state: 'MD', strength: 5 },
];
const TEAM_BY_ABBR = Object.fromEntries(TEAMS.map(t => [t.abbr, t]));
const logoUrl = abbr => `logos/${abbr}.png`;

// Pure game rules. owners = { [regionId]: teamAbbr | null }
const initialOwners = regions => Object.fromEntries(regions.map(r => [r.id, r.team]));

function aliveTeams(owners) {
  return [...new Set(Object.values(owners).filter(Boolean))];
}

function conquer(owners, winner, loser) {
  const o = { ...owners };
  for (const id in o) if (o[id] === loser) o[id] = winner;
  return o;
}

function claim(owners, team, regionId) {
  return { ...owners, [regionId]: team };
}

// Win chances [attacker, defender]. The defender is always home: +5 points in weighted mode.
const HOME_EDGE = 0.05;
function battleOdds(attacker, defender, mode, strengths) {
  if (mode !== 'weighted') return [0.5, 0.5];
  const sa = strengths[attacker], sd = strengths[defender];
  const pd = Math.min(0.95, sd / (sa + sd) + HOME_EDGE);
  return [1 - pd, pd];
}

function resolveBattle(a, b, mode, strengths, rng = Math.random) {
  if (mode === 'pick') return null;
  return rng() < battleOdds(a, b, mode, strengths)[0] ? a : b;

// A made-up game whose final score agrees with an already-decided winner.

function buildRegions(topo) {

    const seeds = teams.map(t => proj([t.lon, t.lat]));

  const bits = Array.from({ length: 180 }, () => ({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.6, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3, w: 6 + Math.random() * 6, h: 3 + Math.random() * 4, col: colors[Math.floor(Math.random() * colors.length)] }));
  const t0 = performance.now();
  const frame = now => {
    ctx.clearRect(0, 0, c.width, c.height);
    for (const b of bits) {
      b.x += b.vx; b.y += b.vy; b.vy += 0.03; b.r += b.vr;
      ctx.save(); ctx.translate(b.x * k, b.y * k); ctx.rotate(b.r); ctx.fillStyle = b.col; ctx.fillRect(-b.w * k / 2, -b.h * k / 2, b.w * k, b.h * k); ctx.restore();

  };
  requestAnimationFrame(frame);
}
function showUpset(winner) { showBanner(winner, 'UPSET!'); sfx.roar(true); }
function showBanner(winner, text) {
  const box = $('upset'), field = $('field');
  box.innerHTML = `<img src="${logoUrl(winner)}" alt=""><span>${text}</span>`;
  box.hidden = false;
  box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
  if (!reduced) { field.classList.remove('shake'); void field.offsetWidth; field.classList.add('shake'); }
  clearTimeout(showBanner.t);
  showBanner.t = setTimeout(() => { box.hidden = true; field.classList.remove('shake'); }, 2400);
}
const listJoin = a => a.length < 2 ? a.join('') : `${a.slice(0, -1).join(', ')} and ${a[a.length - 1]}`;
function nextTurnCount() { state.turn++; }

// ---------- side panels ----------
function drawStandings() {
  const counts = stateCounts(state.owners, STATE_OF);
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 6);
  $('standings').innerHTML = top.map(([a, n]) => `<li><img src="${logoUrl(a)}" alt=""><span>${TEAM_BY_ABBR[a].name}</span><span class="n">${n} ${n === 1 ? 'state' : 'states'}</span></li>`).join('');
}
function addLog(html, label = `Turn ${state.turn + 1}`) { state.log.unshift(`${label}: ${html}`); state.log = state.log.slice(0, 60); }
function drawLog() { $('log').innerHTML = state.log.length ? state.log.map(l => `<li>${l}</li>`).join('') : '<li>No moves yet.</li>'; }

function drawStrengths() {
  const useWL = opt('useRecords');
  $('opt-records').checked = useWL;
  $('strengths').innerHTML = TEAMS.map(t => {
    const [w, l] = state.wl[t.abbr] || ['', ''];
    return useWL
      ? `<label class="wl"><img src="${logoUrl(t.abbr)}" alt=""><span>${t.name}</span><input type="number" min="0" max="17" id="w-${t.abbr}" value="${w}" aria-label="${t.name} wins"><span class="dash">–</span><input type="number" min="0" max="17" id="l-${t.abbr}" value="${l}" aria-label="${t.name} losses"><output id="str-${t.abbr}">${state.strengths[t.abbr]}</output></label>`
      : `<label><img src="${logoUrl(t.abbr)}" alt=""><span>${t.name}</span><input type="number" min="1" max="10" step="0.1" id="str-${t.abbr}" value="${state.strengths[t.abbr]}"></label>`;
  }).join('');
  for (const t of TEAMS) {
    if (useWL) {
      const upd = () => {
        const w = Math.max(0, Math.round(+$(`w-${t.abbr}`).value || 0)), l = Math.max(0, Math.round(+$(`l-${t.abbr}`).value || 0));
        state.wl[t.abbr] = [w, l];
        const v = strengthFromRecord(w, l);
        if (v != null) { state.strengths[t.abbr] = v; $(`str-${t.abbr}`).textContent = v; }
        save(); render();
      };
      $(`w-${t.abbr}`).addEventListener('change', upd); $(`l-${t.abbr}`).addEventListener('change', upd);
    } else $(`str-${t.abbr}`).addEventListener('change', e => {
      const v = Math.max(1, Math.min(10, Math.round((+e.target.value || 1) * 10) / 10));
      e.target.value = v; state.strengths[t.abbr] = v; save(); render();
    });
  }
}
function syncStrengthInputs() { for (const t of TEAMS) { const i = $(`str-${t.abbr}`); if (i) { if ('value' in i && i.tagName === 'INPUT') i.value = state.strengths[t.abbr]; else i.textContent = state.strengths[t.abbr]; } } }
function drawAssign() {
  const s = $('assign');
  s.innerHTML = `<option value="">Off</option>` + TEAMS.map(t => `<option value="${t.abbr}">${t.name}</option>`).join('') + `<option value="__blank">Nobody (make it blank)</option>`;
  s.onchange = () => $('field').classList.toggle('assigning', !!s.value);
}
function onRegionClick(id) {
  const v = $('assign').value;
  if (!v || busy || autoplay || replaying) return;
  const team = v === '__blank' ? null : v, before = state.owners[id];
  if (before === team) return;
  state.owners = claim(state.owners, team, id);
  addLog(`${regionName(BY_ID[id])} handed to <b>${team ? teamName(team) : 'nobody'}</b>`, 'By hand');
  const alive = new Set(aliveTeams(state.owners));
  if ((turn.attacker && !alive.has(turn.attacker)) || (turn.defender && turn.step === 'battle' && !alive.has(turn.defender))) { turn = { step: 'wheel' }; clearAim(); }
  else if (turn.step === 'arrow') drawArrow(turn.attacker, arrowRot);
  if (champion(state.owners)) pendingChamp = champion(state.owners);
  commit(); paint(); render();
  celebrate();
}

// ---------- state ----------
const DEFAULT_OPTIONS = { sound: false, capitals: false, rebellions: false, useRecords: false };
function startStrengths(options, wl) {
  return Object.fromEntries(TEAMS.map(t => {
    const fromWL = options.useRecords && wl[t.abbr] ? strengthFromRecord(...wl[t.abbr]) : null;
    return [t.abbr, fromWL ?? t.strength];
  }));
}
function fresh(keep = {}) {
  const options = { ...DEFAULT_OPTIONS, ...(keep.options || {}) }, wl = keep.wl || {};
  const owners = initialOwners(REGIONS);
  return { owners, strengths: startStrengths(options, wl), mode: keep.mode || 'pick', log: [], turn: 0, options, wl, records: {},
    history: [{ t: 0, c: encodeOwners(owners, REGIONS.map(r => r.id), TEAMS.map(t => t.abbr)) }] };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE));
    // saved games from older versions may have extra regions (Alaska, Hawaii): keep only today's regions
    if (s && s.owners && REGIONS.every(r => r.id in s.owners)) { const f = fresh(s); return { ...f, ...s, options: f.options, wl: f.wl, records: s.records || {}, history: s.history && s.history.length ? s.history : f.history, owners: Object.fromEntries(REGIONS.map(r => [r.id, s.owners[r.id]])) }; }
  } catch {}
  return fresh();
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {} }

let resetArmed = null;
function doReset() {
  stopAuto(); exitReplay(false);
  state = fresh(state); turn = { step: 'wheel' }; wheelRot = 0; arrowRot = 0;
  clearAim(); save(); drawStrengths(); paint(); render(); drawReplay(); drawRecords();
}

// ---------- options ----------
function wireOptions() {
  for (const k of ['sound', 'capitals', 'rebellions']) {
    const box = $(`opt-${k}`);
    box.checked = opt(k);
    box.onchange = () => { state.options[k] = box.checked; if (k === 'sound' && box.checked) { ac(); sfx.whistle(); } save(); paint(); render(); };
  }
  $('opt-records').onchange = e => {
    state.options.useRecords = e.target.checked;
    if (e.target.checked) for (const t of TEAMS) { const wl = state.wl[t.abbr]; const v = wl ? strengthFromRecord(...wl) : null; if (v != null) state.strengths[t.abbr] = v; }
    save(); drawStrengths(); render();
  };
  $('auto-btn').onclick = () => autoplay ? stopAuto() : startAuto();
  $('auto-speed').onchange = e => { autoSpeed = +e.target.value; };
  $('replay-slider').oninput = e => showReplay(+e.target.value);
  $('replay-play').onclick = playReplay;
  $('replay-exit').onclick = () => exitReplay(true);
}

// ---------- sound (made in the browser, no files) ----------
let AC = null;
function ac() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(freq, dur, type = 'sine', gain = 0.12, when = 0) {
  const a = ac(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, gain, freq) {
  const a = ac(), n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.5;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + dur * 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(a.destination); src.start();
}
const sfx = {
  whistle() { if (!opt('sound')) return; for (let i = 0; i < 6; i++) tone(2700 + (i % 2) * 260, 0.07, 'sine', 0.07, i * 0.07); },
  roar(big) { if (!opt('sound')) return; noise(big ? 2.2 : 1.2, big ? 0.55 : 0.3, 800); },
  cheer() { if (!opt('sound')) return; noise(0.6, 0.14, 1300); },
  horn() { if (!opt('sound')) return; [110, 138.6, 164.8].forEach(f => tone(f, 1.1, 'sawtooth', 0.06)); },
};

// ---------- auto-play ----------
function drawAuto() {
  const b = $('auto-btn'); if (!b) return;
  const can = state.mode !== 'pick' && !champion(state.owners) && !replaying;
  b.textContent = autoplay ? 'Stop auto-play' : 'Auto-play';
  b.className = autoplay ? 'btn danger' : 'btn ghost';
  b.disabled = !autoplay && (!can || busy);
  $('auto-hint').hidden = state.mode !== 'pick';
}
function startAuto() { if (state.mode === 'pick') return; autoplay = true; render(); autoLoop(); }
function stopAuto() { autoplay = false; if (state) render(); }
async function autoLoop() {
  while (autoplay && !champion(state.owners)) {
    if (busy) { await sleep(100); continue; }
    if (turn.step === 'wheel') await spinWheel();
    else if (turn.step === 'arrow') await spinArrow();
    else if (turn.step === 'battle') await fight();
    else if (turn.step === 'done') { await sleep(1400 / autoSpeed); if (autoplay) nextTurn(); }
    await sleep(300 / autoSpeed);
  }
  autoplay = false; render();
}

// ---------- history replay ----------
function drawReplay() {
  const sl = $('replay-slider'); if (!sl || !state) return;
  const n = state.history.length;
  sl.max = Math.max(0, n - 1);
  if (!replaying) sl.value = n - 1;
  $('replay-label').textContent = replaying ? `Turn ${state.history[+sl.value].t} of ${state.turn}` : `${n - 1} ${n - 1 === 1 ? 'move' : 'moves'} recorded`;
  $('replay-exit').hidden = !replaying;
  sl.disabled = n < 2; $('replay-play').disabled = n < 2;
}
function showReplay(i) {
  if (busy || autoplay) return;
  replaying = true; clearAim();
  $('replay-slider').value = i;
  paint(decodeOwners(state.history[i].c, REGIONS.map(r => r.id), TEAMS.map(t => t.abbr)));
  drawReplay(); render();
}
let replayTimer = null;
async function playReplay() {
  if (busy || autoplay) return;
  if (replayTimer) { clearTimeout(replayTimer); replayTimer = null; $('replay-play').textContent = 'Play'; return; }
  let i = replaying && +$('replay-slider').value < state.history.length - 1 ? +$('replay-slider').value : 0;
  $('replay-play').textContent = 'Pause';
  const step = () => {
    showReplay(i);
    if (++i < state.history.length) replayTimer = setTimeout(step, 450);
    else { replayTimer = null; $('replay-play').textContent = 'Play'; }
  };
  step();
}
function exitReplay(redraw) {
  if (replayTimer) { clearTimeout(replayTimer); replayTimer = null; }
  const b = $('replay-play'); if (b) b.textContent = 'Play';
  if (!replaying) return;
  replaying = false;
  if (redraw) { paint(); drawReplay(); render(); }
}

// ---------- record book ----------
function recordLines() {
  const r = state.records || {}, nm = a => TEAM_BY_ABBR[a].name;
  return [
    `<li><span>Biggest upset</span><b>${r.upset ? `${nm(r.upset.team)} over the ${teamName(r.upset.vs)} (${r.upset.pct}%)` : '—'}</b></li>`,
    `<li><span>Longest win streak</span><b>${r.streak ? `${nm(r.streak.team)}, ${r.streak.n} ${r.streak.n === 1 ? 'win' : 'wins'}` : '—'}</b></li>`,
    `<li><span>Most states at once</span><b>${r.peak && r.peak.n > 1 ? `${nm(r.peak.team)}, ${r.peak.n} states` : '—'}</b></li>`,
    `<li><span>Fastest knockout</span><b>${r.fastestOut ? `${nm(r.fastestOut.team)} on turn ${r.fastestOut.turn} (by the ${teamName(r.fastestOut.by)})` : '—'}</b></li>`,
  ];
}
function drawRecords() { const e = $('records'); if (e && state) e.innerHTML = recordLines().join(''); }

async function boot() {
  const topo = await (await fetch('states-10m.json')).json();
  const built = buildRegions(topo);
  REGIONS = built.regions;
  BY_ID = Object.fromEntries(REGIONS.map(r => [r.id, r]));
  STATE_OF = Object.fromEntries(REGIONS.map(r => [r.id, r.state]));
  CENT = Object.fromEntries(REGIONS.map(r => [r.id, r.at]));
  LABEL.fill(-1);
  REGIONS.forEach((r, i) => { for (const [x, y] of r.pts) for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) { const gx = x + dx, gy = y + dy; if (gx < W && gy < H) LABEL[gy * W + gx] = i; } });
  await Promise.all(TEAMS.map(t => new Promise(res => { const im = new Image(); im.onload = im.onerror = res; im.src = logoUrl(t.abbr); })));
  for (const t of TEAMS) CAPITALS[t.abbr] = REGIONS.find(r => r.team === t.abbr && r.state !== 'DC').id;
  drawMap(built);
  state = load();
  $('loading').hidden = true;
  drawStrengths(); drawAssign(); wireOptions(); drawReplay(); drawRecords();
  for (const b of document.querySelectorAll('.seg button')) b.onclick = () => { state.mode = b.dataset.mode; if (state.mode === 'pick') stopAuto(); save(); render(); };
  $('reset').onclick = () => {
    const b = $('reset');
    if (resetArmed) { clearTimeout(resetArmed); resetArmed = null; b.textContent = 'Reset map'; b.className = 'btn ghost'; doReset(); return; }
    b.textContent = 'Click again to reset'; b.className = 'btn danger';
    resetArmed = setTimeout(() => { resetArmed = null; b.textContent = 'Reset map'; b.className = 'btn ghost'; }, 3000);
  };
  paint(); render();
}
boot().catch(err => { $('loading').textContent = `The map didn't load (${err.message}). Reload the page to try again.`; });

</script>
