<meta charset="utf-8">
<title>NFL Imperialism</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: the map is the field, a sideline panel holds the wheel and the play-by-play. Single dark "turf + chalk" look, by choice. */
:root {
  --turf: #10201b;
  --turf-2: #172c25;
  --turf-3: #21392f;
  --chalk: #eef2ea;
  --chalk-dim: #a9b8ae;
  --line: rgba(238,242,234,.7);
  --blank: #34483f;
  --gold: #f0b429;
  --danger: #e5484d;
  --display: "Saira Condensed", "Arial Narrow", sans-serif;
  --body: "Inter", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--turf); color: var(--chalk); font-family: var(--body); }
.app {
  display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px;
  padding-block: 16px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1500px; margin: 0 auto;
}
@media (max-width: 960px) { .app { grid-template-columns: minmax(0, 1fr); } .field { position: static; } }
header { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 4vw, 44px); letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1; }
h1 span { color: var(--gold); }
.tally { font-family: var(--display); font-size: 18px; color: var(--chalk-dim); letter-spacing: .06em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.field { min-width: 0; align-self: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); background: var(--turf-2); border-radius: 14px; padding: 8px; position: relative; }
#map { width: 100%; height: auto; display: block; }
.region { transition: fill .5s ease, stroke .5s ease; cursor: default; }
.split-line { fill: none; stroke: var(--line); stroke-width: .6; stroke-dasharray: 3 2; pointer-events: none; }
.borders { fill: none; stroke: var(--line); stroke-width: 1; stroke-linecap: round; pointer-events: none; }
.outline { fill: none; stroke: var(--chalk); stroke-width: 1.2; pointer-events: none; }
.assigning .region { cursor: crosshair; }
.region.target { stroke: var(--gold); stroke-width: 3; animation: pulse 0.9s ease-in-out infinite alternate; }
@keyframes pulse { from { stroke-opacity: 1 } to { stroke-opacity: .25 } }
.logo { pointer-events: none; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.6)); }
.aim { stroke: var(--gold); stroke-width: 2; stroke-dasharray: 6 4; fill: none; pointer-events: none; }
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--turf-2); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.label { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--chalk-dim); margin: 0; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--turf); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { background: transparent; color: var(--chalk-dim); border: 0; border-radius: 8px; padding: 8px 4px; font: 600 13px var(--body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--turf-3); color: var(--chalk); box-shadow: inset 0 0 0 1px var(--line); }
.wheel-wrap { position: relative; width: 100%; max-width: 300px; margin: 0 auto; aspect-ratio: 1; }
.wheel-wrap svg { width: 100%; height: 100%; display: block; }
.pointer { position: absolute; left: 50%; top: -4px; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid var(--gold); filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); z-index: 2; }
.btn { appearance: none; border: 0; border-radius: 10px; padding: 12px 16px; font: 800 18px var(--display); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; background: var(--gold); color: #1d1503; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--chalk); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.danger { background: var(--danger); color: #fff; }
.btn:focus-visible, .seg button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.matchup { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
.side-team { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 10px; transition: background .12s, transform .12s; }
.side-team img { width: 64px; height: 64px; background: var(--chalk); border-radius: 50%; padding: 8px; box-sizing: border-box; }
.side-team .nm { font: 600 13px var(--body); }
.side-team .pct { font: 800 20px var(--display); color: var(--gold); font-variant-numeric: tabular-nums; }
.side-team.lit { background: var(--turf-3); transform: scale(1.06); }
.side-team.win { background: var(--gold); color: #1d1503; }
.side-team.win .pct { color: #1d1503; }
.vs { font: 800 22px var(--display); color: var(--chalk-dim); }
.status { font-size: 15px; line-height: 1.45; margin: 0; min-height: 1.45em; }
.status b { color: var(--gold); font-weight: 600; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 120px; }
select, input[type=number] { background: var(--turf); color: var(--chalk); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: 500 14px var(--body); }
select { width: 100%; }
.hint { font-size: 13px; color: var(--chalk-dim); margin: 0; line-height: 1.4; }
.standings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.standings li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
.standings img, .strengths img { width: 22px; height: 22px; background: var(--chalk); border-radius: 50%; padding: 2px; box-sizing: border-box; }
.standings .n { font-variant-numeric: tabular-nums; color: var(--chalk-dim); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--chalk-dim); max-height: 180px; overflow-y: auto; }
.log li b { color: var(--chalk); font-weight: 600; }
details summary { cursor: pointer; }
.strengths { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 10px; max-height: 320px; overflow-y: auto; padding-right: 4px; }
.strengths label { display: grid; grid-template-columns: 22px 1fr 64px; gap: 8px; align-items: center; font-size: 13px; }
.overlay { position: fixed; inset: 0; background: rgba(6,14,11,.82); display: grid; place-items: center; z-index: 20; padding: 24px; }
.overlay .champ { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.overlay img { width: min(220px, 50vw); height: auto; background: var(--chalk); border-radius: 50%; padding: 24px; box-sizing: border-box; }
.overlay h2 { font: 800 clamp(32px, 6vw, 64px)/1 var(--display); text-transform: uppercase; margin: 0; letter-spacing: .03em; }
.overlay p { margin: 0; color: var(--chalk-dim); font-size: 16px; }
.game { width: min(520px, 100%); background: var(--turf-2); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.board { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; background: #0a1411; border-radius: 12px; padding: 12px; }
.bt { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 8px; border-radius: 8px; padding: 4px 6px; }
.bt img { width: 40px; height: 40px; background: var(--chalk); border-radius: 50%; padding: 4px; box-sizing: border-box; }
.bt span { font: 600 14px var(--body); }
.bt b { font: 800 34px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--gold); }
.bt.won { background: var(--gold); color: #1d1503; } .bt.won b { color: #1d1503; }
.clock { display: flex; flex-direction: column; align-items: center; font: 800 16px var(--display); letter-spacing: .08em; color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
.gfield { width: 100%; height: auto; border-radius: 8px; display: block; }
.plays { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; min-height: 6.5em; }
.plays .q { color: var(--chalk-dim); font-variant-numeric: tabular-nums; margin-right: 6px; font-size: 12px; }
.plays b { color: var(--gold); }
@media (max-width: 480px) { .bt { grid-template-columns: 32px auto; } .bt span { display: none; } .bt img { width: 32px; height: 32px; } }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--chalk-dim); }
@media (prefers-reduced-motion: reduce) { .region { transition: none; } .region.target { animation: none; } }
</style>

<div class="app">
  <header>
    <h1>NFL <span>Imperialism</span></h1>
    <div class="tally" id="tally"></div>
  </header>

  <div class="field" id="field">
    <svg id="map" viewBox="0 0 975 610" role="img" aria-label="Map of the United States colored by NFL team territory"></svg>
    <div class="loading" id="loading">Loading map…</div>
  </div>

  <aside class="side">
    <section class="card">
      <p class="label">Battle mode</p>
      <div class="seg" role="group" aria-label="Battle mode">
        <button id="mode-pick" data-mode="pick">Pick winner</button>
        <button id="mode-fifty" data-mode="fifty">50 / 50</button>
        <button id="mode-weighted" data-mode="weighted">Weighted</button>
      </div>
    </section>

    <section class="card" id="turn">
      <div class="wheel-wrap"><div class="pointer"></div><svg id="wheel" viewBox="0 0 300 300"></svg></div>
      <p class="status" id="status"></p>
      <div id="matchup"></div>
      <div class="row" id="actions"></div>
    </section>

    <section class="card">
      <p class="label">Hand land to a team</p>
      <select id="assign" aria-label="Team that gets the state you click"></select>
      <p class="hint">Pick a team, then click any state on the map to give it to them.</p>
    </section>

    <section class="card">
      <p class="label">Biggest empires</p>
      <ol class="standings" id="standings"></ol>
    </section>

    <section class="card">
      <p class="label">Play-by-play</p>
      <ul class="log" id="log"></ul>
    </section>

    <section class="card">
      <details>
        <summary class="label">Team strength (weighted mode)</summary>
        <div class="strengths" id="strengths"></div>
      </details>
    </section>

    <section class="card">
      <button class="btn ghost" id="reset">Reset map</button>
    </section>
  </aside>
</div>
<div class="overlay" id="overlay" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
// lat/lon = split seed (real city, nudged so split states divide the way the game is played)
const TEAMS = [
  { abbr: 'ari', name: 'Arizona Cardinals',     color: '#97233F', color2: '#FFB612', lat: 33.53, lon: -112.26, state: 'AZ', strength: 4 },
  { abbr: 'atl', name: 'Atlanta Falcons',       color: '#A71930', color2: '#000000', lat: 33.76, lon: -84.40,  state: 'GA', strength: 5 },
  { abbr: 'bal', name: 'Baltimore Ravens',      color: '#241773', color2: '#9E7C0C', lat: 39.45, lon: -76.10,  state: 'MD', strength: 8 },
  { abbr: 'buf', name: 'Buffalo Bills',         color: '#00338D', color2: '#C60C30', lat: 42.70, lon: -78.40,  state: 'NY', strength: 9 },
  { abbr: 'car', name: 'Carolina Panthers',     color: '#0085CA', color2: '#101820', lat: 35.23, lon: -80.85,  state: 'NC', strength: 4 },
  { abbr: 'chi', name: 'Chicago Bears',         color: '#0B162A', color2: '#C83803', lat: 41.86, lon: -87.62,  state: 'IL', strength: 6 },
  { abbr: 'cin', name: 'Cincinnati Bengals',    color: '#FB4F14', color2: '#000000', lat: 39.30, lon: -82.70,  state: 'OH', strength: 6 },
  { abbr: 'cle', name: 'Cleveland Browns',      color: '#311D00', color2: '#FF3C00', lat: 41.00, lon: -82.70,  state: 'OH', strength: 3 },
  { abbr: 'dal', name: 'Dallas Cowboys',        color: '#003594', color2: '#869397', lat: 31.00, lon: -102.30, state: 'TX', strength: 5 },
  { abbr: 'den', name: 'Denver Broncos',        color: '#FB4F14', color2: '#002244', lat: 39.74, lon: -105.02, state: 'CO', strength: 8 },
  { abbr: 'det', name: 'Detroit Lions',         color: '#0076B6', color2: '#B0B7BC', lat: 42.34, lon: -83.05,  state: 'MI', strength: 8 },
  { abbr: 'gb',  name: 'Green Bay Packers',     color: '#203731', color2: '#FFB612', lat: 44.50, lon: -88.06,  state: 'WI', strength: 7 },
  { abbr: 'hou', name: 'Houston Texans',        color: '#03202F', color2: '#A71930', lat: 31.00, lon: -96.30,  state: 'TX', strength: 6 },
  { abbr: 'ind', name: 'Indianapolis Colts',    color: '#002C5F', color2: '#A2AAAD', lat: 39.76, lon: -86.16,  state: 'IN', strength: 6 },
  { abbr: 'jax', name: 'Jacksonville Jaguars',  color: '#006778', color2: '#D7A22A', lat: 30.32, lon: -81.64,  state: 'FL', strength: 6 },
  { abbr: 'kc',  name: 'Kansas City Chiefs',    color: '#E31837', color2: '#FFB81C', lat: 39.05, lon: -94.48,  state: 'MO', strength: 8 },
  { abbr: 'lv',  name: 'Las Vegas Raiders',     color: '#000000', color2: '#A5ACAF', lat: 36.09, lon: -115.18, state: 'NV', strength: 3 },
  { abbr: 'lac', name: 'Los Angeles Chargers',  color: '#0080C6', color2: '#FFC20E', lat: 33.30, lon: -116.80, state: 'CA', strength: 7 },
  { abbr: 'lar', name: 'Los Angeles Rams',      color: '#003594', color2: '#FFA300', lat: 36.00, lon: -119.50, state: 'CA', strength: 8 },
  { abbr: 'mia', name: 'Miami Dolphins',        color: '#008E97', color2: '#FC4C02', lat: 25.96, lon: -80.24,  state: 'FL', strength: 4 },
  { abbr: 'min', name: 'Minnesota Vikings',     color: '#4F2683', color2: '#FFC62F', lat: 44.97, lon: -93.26,  state: 'MN', strength: 6 },
  { abbr: 'ne',  name: 'New England Patriots',  color: '#002244', color2: '#C60C30', lat: 42.09, lon: -71.26,  state: 'MA', strength: 7 },
  { abbr: 'no',  name: 'New Orleans Saints',    color: '#D3BC8D', color2: '#101820', lat: 29.95, lon: -90.08,  state: 'LA', strength: 3 },
  { abbr: 'nyg', name: 'New York Giants',       color: '#0B2265', color2: '#A71930', lat: 41.00, lon: -73.90,  state: 'NY', strength: 4 },
  { abbr: 'nyj', name: 'New York Jets',         color: '#125740', color2: '#FFFFFF', lat: 43.50, lon: -75.30,  state: 'NY', strength: 3 },
  { abbr: 'phi', name: 'Philadelphia Eagles',   color: '#004C54', color2: '#A5ACAF', lat: 39.90, lon: -75.17,  state: 'PA', strength: 8 },
  { abbr: 'pit', name: 'Pittsburgh Steelers',   color: '#FFB612', color2: '#101820', lat: 40.45, lon: -80.02,  state: 'PA', strength: 6 },
  { abbr: 'sf',  name: 'San Francisco 49ers',   color: '#AA0000', color2: '#B3995D', lat: 39.50, lon: -121.50, state: 'CA', strength: 7 },
  { abbr: 'sea', name: 'Seattle Seahawks',      color: '#002244', color2: '#69BE28', lat: 47.60, lon: -122.33, state: 'WA', strength: 8 },
  { abbr: 'tb',  name: 'Tampa Bay Buccaneers',  color: '#D50A0A', color2: '#34302B', lat: 27.98, lon: -82.50,  state: 'FL', strength: 6 },
  { abbr: 'ten', name: 'Tennessee Titans',      color: '#4B92DB', color2: '#0C2340', lat: 36.17, lon: -86.77,  state: 'TN', strength: 2 },
  { abbr: 'wsh', name: 'Washington Commanders', color: '#5A1414', color2: '#FFB612', lat: 39.00, lon: -77.70,  state: 'MD', strength: 5 },
];
const TEAM_BY_ABBR = Object.fromEntries(TEAMS.map(t => [t.abbr, t]));
const logoUrl = abbr => `logos/${abbr}.png`;

// Pure game rules. owners = { [regionId]: teamAbbr | null }
const initialOwners = regions => Object.fromEntries(regions.map(r => [r.id, r.team]));

function aliveTeams(owners) {
  return [...new Set(Object.values(owners).filter(Boolean))];
}

function conquer(owners, winner, loser) {
  const o = { ...owners };
  for (const id in o) if (o[id] === loser) o[id] = winner;
  return o;
}

function claim(owners, team, regionId) {
  return { ...owners, [regionId]: team };
}

function resolveBattle(a, b, mode, strengths, rng = Math.random) {
  if (mode === 'pick') return null;
  const pa = mode === 'weighted' ? strengths[a] / (strengths[a] + strengths[b]) : 0.5;
  return rng() < pa ? a : b;
}

function teamCentroid(team, centroids, owners) {
  const pts = Object.keys(owners).filter(id => owners[id] === team).map(id => centroids[id]);
  return [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length];
}

const angDiff = (a, b) => Math.abs(((a - b + 540) % 360) - 180);

// angleDeg in screen coords: 0 = right, 90 = down.
// Only land that shares a border with the team's territory can be hit. Of those, take the one closest to
// the arrow's direction, within `cone` degrees. Nothing there (water, Canada, Mexico) -> null, meaning respin.
function pickTarget(team, angleDeg, centroids, owners, adjacency, cone = 45) {
  const [cx, cy] = teamCentroid(team, centroids, owners);
  const near = new Set();
  for (const [a, b] of adjacency) {
    if (owners[a] === team && owners[b] !== team) near.add(b);
    if (owners[b] === team && owners[a] !== team) near.add(a);
  }
  let best = null, bestDiff = Infinity;
  for (const id of near) {
    const [x, y] = centroids[id];
    const diff = angDiff(Math.atan2(y - cy, x - cx) * 180 / Math.PI, angleDeg);
    if (diff <= cone && diff < bestDiff) { bestDiff = diff; best = id; }
  }
  return best;
}

function champion(owners) {
  const alive = aliveTeams(owners);
  return alive.length === 1 ? alive[0] : null;
}

// A border line shows unless the same team owns both sides. Lines between two open states stay.
function showBorder(owners, a, b) {
  return owners[a] !== owners[b] || !owners[a];
}

// Connected pieces of land per team. adjacency = [[regionA, regionB], ...] for regions that share a border.
function territories(owners, adjacency) {
  const nb = {};
  for (const [a, b] of adjacency) if (owners[a] && owners[a] === owners[b]) { (nb[a] ||= []).push(b); (nb[b] ||= []).push(a); }
  const seen = new Set(), out = [];
  for (const id in owners) {
    if (!owners[id] || seen.has(id)) continue;
    const ids = [], stack = [id];
    seen.add(id);
    while (stack.length) { const x = stack.pop(); ids.push(x); for (const y of nb[x] || []) if (!seen.has(y)) { seen.add(y); stack.push(y); } }
    out.push({ team: owners[id], ids });
  }
  return out;
}

// How many states each team holds any part of. A split state counts once; DC counts as Maryland.
function stateCounts(owners, stateOf) {
  const seen = {};
  for (const id in owners) {
    const t = owners[id];
    if (!t) continue;
    const st = stateOf[id] === 'DC' ? 'MD' : stateOf[id];
    (seen[t] ||= new Set()).add(st);
  }
  return Object.fromEntries(Object.entries(seen).map(([t, s]) => [t, s.size]));
}

const touchesTeam = (team, id, owners, adjacency) =>
  adjacency.some(([a, b]) => (a === id && owners[b] === team) || (b === id && owners[a] === team));

// Follow the arrow's line from (ox, oy). labelAt(x, y) -> region id, or null for water / off the map.
// The first land not owned by the team is the target. Crossing open water is only allowed to land the
// team already borders by land (Packers -> Lions). Nothing reached -> null, meaning respin.
function rayTarget(team, [ox, oy], angleDeg, labelAt, owners, adjacency, { maxDist = 1500, minGap = 4, step = 1 } = {}) {
  const dx = Math.cos(angleDeg * Math.PI / 180), dy = Math.sin(angleDeg * Math.PI / 180);
  let gap = 0, crossedWater = false;
  for (let t = 0; t <= maxDist; t += step) {
    const id = labelAt(ox + dx * t, oy + dy * t);
    if (!id) { gap += step; if (gap >= minGap) crossedWater = true; continue; }
    gap = 0;
    if (owners[id] === team) { crossedWater = false; continue; }
    if (!crossedWater) return id;
    return touchesTeam(team, id, owners, adjacency) ? id : null;
  }
  return null;
}

// Empty pockets of land bordered by exactly one team go to that team. Returns { regionId: team }.
function enclosedClaims(owners, adjacency) {
  const nb = {};
  for (const [a, b] of adjacency) { (nb[a] ||= []).push(b); (nb[b] ||= []).push(a); }
  const seen = new Set(), out = {};
  for (const id in owners) {
    if (owners[id] || seen.has(id)) continue;
    const pocket = [], stack = [id], around = new Set();
    seen.add(id);
    while (stack.length) {
      const x = stack.pop(); pocket.push(x);
      for (const y of nb[x] || []) {
        if (!(y in owners)) continue;
        if (owners[y]) around.add(owners[y]);
        else if (!seen.has(y)) { seen.add(y); stack.push(y); }
      }
    }
    if (around.size === 1) { const t = [...around][0]; for (const p of pocket) out[p] = t; }
  }
  return out;
}

// A win adds a tenth of the loser's strength: beating a 9 is worth +0.9, beating a 3 is worth +0.3. Max 10.
const round1 = x => Math.round(x * 10) / 10;
const boostWinner = (strengths, winner, loser) =>
  ({ ...strengths, [winner]: Math.min(10, round1((strengths[winner] || 1) + (strengths[loser] || 1) / 10)) });

const fillAll = (owners, team) => Object.fromEntries(Object.keys(owners).map(id => [id, team]));

// A made-up game whose final score agrees with an already-decided winner.
// Returns { events: [{ q, clock, team, pts, kind, yards }], score: { [team]: points } }.
function simulateGame(winner, loser, rng = Math.random) {
  const pick = arr => arr[Math.floor(rng() * arr.length)];
  const score = { [winner]: 0, [loser]: 0 }, events = [];
  const play = (q, team, clock) => {
    const r = rng();
    let pts, kind, yards;
    if (r < 0.52) { pts = 7; kind = pick(['pass', 'run']); yards = kind === 'pass' ? 3 + Math.floor(rng() * 60) : 1 + Math.floor(rng() * 30); }
    else if (r < 0.88) { pts = 3; kind = 'fg'; yards = 22 + Math.floor(rng() * 33); }
    else if (r < 0.94) { pts = 6; kind = 'missed-xp'; yards = 2 + Math.floor(rng() * 40); }
    else if (r < 0.98) { pts = 8; kind = 'two-point'; yards = 2 + Math.floor(rng() * 40); }
    else { pts = 2; kind = 'safety'; yards = 0; }
    score[team] += pts;
    events.push({ q, clock, team, pts, kind, yards });
  };
  for (let q = 1; q <= 4; q++) {
    const n = Math.floor(rng() * 3); // 0-2 scores a quarter
    const clocks = Array.from({ length: n }, () => 1 + Math.floor(rng() * 14 * 60)).sort((a, b) => b - a);
    for (const c of clocks) play(q, rng() < 0.55 ? winner : loser, c);
  }
  // late drives until the winner is ahead
  let clock = 120;
  while (score[winner] <= score[loser]) { play(4, winner, clock); clock = Math.max(1, clock - 40); }
  events.sort((a, b) => a.q - b.q || b.clock - a.clock);
  return { events, score };
}

// ---------- geometry ----------
const GRID = new Uint8Array(W * H);
function anchor(points, fallback) {

    for (const r of [4, 8, 12, 16, 20]) { if (dirs.every(([dx, dy]) => inside(p[0] + dx * r, p[1] + dy * r))) room = r; else break; }

}

function buildRegions(topo) {
  const all = topojson.feature(topo, topo.objects.states);
  const fc = { type: 'FeatureCollection', features: all.features.filter(f => !SKIP.has(f.properties.name)) };
  const proj = d3.geoAlbersUsa().fitExtent([[8, 8], [W - 8, H - 8]], fc);
  const path = d3.geoPath(proj);
  const ctx = document.createElement('canvas').getContext('2d');
  const out = [];
  for (const f of fc.features) {
    const code = NAME_TO_CODE[f.properties.name];
    const d = code && path(f);
    if (!d) continue;
    const p2 = new Path2D(d);
    const [[x0, y0], [x1, y1]] = path.bounds(f);
    const teams = code === 'DC' ? [TEAM_BY_ABBR.wsh] : TEAMS.filter(t => t.state === code);
    const seeds = teams.map(t => proj([t.lon, t.lat]));
    const step = 2;
    const buckets = teams.length > 1 ? teams.map(() => []) : [[]];
    for (let y = Math.floor(y0); y <= y1; y += step) for (let x = Math.floor(x0); x <= x1; x += step) {
      if (!ctx.isPointInPath(p2, x, y)) continue;
      let k = 0;
      if (teams.length > 1) { let b = Infinity; seeds.forEach((s, i) => { const dd = (s[0] - x) ** 2 + (s[1] - y) ** 2; if (dd < b) { b = dd; k = i; } }); }
      buckets[k].push([x, y]);
    }
    if (teams.length <= 1) {
      out.push({ id: code, state: code, team: teams[0]?.abbr ?? null, d, clip: null, at: anchor(buckets[0], path.centroid(f)), area: path.area(f), pts: buckets[0] });
    } else {
      const vor = d3.Delaunay.from(seeds).voronoi([x0 - 10, y0 - 10, x1 + 10, y1 + 10]);
      teams.forEach((t, i) => out.push({ id: `${code}-${t.abbr}`, state: code, team: t.abbr, d: vor.renderCell(i), clip: code, stateD: d, at: anchor(buckets[i], seeds[i]), area: buckets[i].length * step * step, pts: buckets[i] }));
    }
  }
  return { regions: out, path, fc, topo, segments: buildSegments(topo, proj, out, ctx) };
}

// Every piece of border, tagged with the region on each side, so lines can vanish inside one team's land.
function buildSegments(topo, proj, regions, ctx) {
  const parts = {}; // state code -> [{id, xy}] for split states
  for (const r of regions) if (r.clip) {
    const t = TEAM_BY_ABBR[r.team];
    (parts[r.state] ||= []).push({ id: r.id, xy: proj([t.lon, t.lat]), d: r.stateD });
  }
  const regionAt = (code, [x, y]) => {
    const ps = parts[code];
    if (!ps) return code;
    let best = ps[0], b = Infinity;
    for (const p of ps) { const dd = (p.xy[0] - x) ** 2 + (p.xy[1] - y) ** 2; if (dd < b) { b = dd; best = p; } }
    return best.id;
  };
  // which states use each arc
  const users = new Map();
  for (const g of topo.objects.states.geometries) {
    const code = NAME_TO_CODE[g.properties.name];
    if (!code || SKIP.has(g.properties.name)) continue;
    const walk = a => Array.isArray(a) ? a.forEach(walk) : (k => { const set = users.get(k) || new Set(); set.add(code); users.set(k, set); })(a < 0 ? ~a : a);
    walk(g.arcs);
  }
  const segs = [];
  for (const [arc, set] of users) {
    if (set.size !== 2) continue; // coastline / country edge: drawn by the outline
    const [sa, sb] = [...set];
    const pts = topojson.feature(topo, { type: 'LineString', arcs: [arc] }).geometry.coordinates.map(c => proj(c));
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i - 1], q = pts[i];
      if (!p || !q) continue;
      const m = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
      segs.push({ p, q, a: regionAt(sa, m), b: regionAt(sb, m) });
    }
  }
  // dividing lines inside split states: sample along each pair's bisector inside the state
  for (const code in parts) {
    const ps = parts[code], p2 = new Path2D(ps[0].d);
    for (let i = 0; i < ps.length; i++) for (let j = i + 1; j < ps.length; j++) {
      const [ax, ay] = ps[i].xy, [bx, by] = ps[j].xy;
      const mx = (ax + bx) / 2, my = (ay + by) / 2, dx = -(by - ay), dy = bx - ax, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;

        const near = regionAt(code, [m[0] + (ax - bx) * 0.001, m[1] + (ay - by) * 0.001]);
        const near2 = regionAt(code, [m[0] - (ax - bx) * 0.001, m[1] - (ay - by) * 0.001]);
        if (near === ps[i].id && near2 === ps[j].id) segs.push({ p, q, a: ps[i].id, b: ps[j].id });
      }
    }
  }

}

function territorySpot(t) {
  const key = [...t.ids].sort().join(',');
  let spot = ANCHOR_CACHE.get(key);
  if (!spot) {
    const rs = t.ids.map(id => BY_ID[id]);
    const area = rs.reduce((n, r) => n + r.area, 0);
    const at = rs.length === 1 ? rs[0].at : anchor(rs.flatMap(r => r.pts), rs[0].at);
    spot = { at, area };
    ANCHOR_CACHE.set(key, spot);
  }

}
// Where a team's logo sits: the middle of its biggest territory. The arrow spins from here.

// ---------- wheel ----------
function wheelTeams() { const alive = new Set(aliveTeams(state.owners)); return TEAMS.filter(t => alive.has(t.abbr)); }
function drawWheel() {

  const g = el('g', { id: 'wheel-rot', transform: `rotate(${wheelRot} ${cx} ${cy})` }, svg);

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const mod = (a, n) => ((a % n) + n) % n;

async function spinWheel() {

  const jitter = (Math.random() - 0.5) * (360 / n) * 0.6;

  await animate(wheelRot, target, 3800, setWheel);

  busy = false; render();

// ---------- arrow ----------
function drawArrow(team, rot) {
  gArrow.innerHTML = '';
  if (!team) return;
  const [cx, cy] = teamSpot(team);
  const g = el('g', { transform: `translate(${cx} ${cy}) rotate(${rot})` }, gArrow);
  el('circle', { r: 9, fill: TEAM_BY_ABBR[team].color, stroke: '#fff', 'stroke-width': 2.5 }, g);
  el('path', { d: 'M8,-5 L62,-5 L62,-14 L88,0 L62,14 L62,5 L8,5 Z', fill: '#f0b429', stroke: '#1d1503', 'stroke-width': 2, 'stroke-linejoin': 'round' }, g);
}
async function spinArrow() {
  busy = true; render();
  const a = turn.attacker, final = Math.random() * 360;
  const target = arrowRot + 720 + mod(final - arrowRot, 360);
  await animate(arrowRot, target, 2600, r => drawArrow(a, r));

        <ellipse id="g-ball" cx="120" cy="35" rx="5" ry="3.2" fill="#8a4b20" stroke="#fff" stroke-width=".8"/>
      </svg>
      <ul class="plays" id="g-plays"><li>Kickoff!</li></ul>
      <div class="row"><button class="btn ghost" id="g-skip">Skip to final</button></div>
    </div>`;
    ov.hidden = false;
    const scA = $('sc-a'), scB = $('sc-b'), qEl = $('g-q'), clockEl = $('g-clock'), plays = $('g-plays'), ball = $('g-ball');
    const QMS = reduced ? 0 : 1900; // real milliseconds per quarter
    const names = ['1st', '2nd', '3rd', '4th'];
    const score = { [a]: 0, [b]: 0 };
    let idx = 0, done = false, raf = 0, t0 = performance.now(), ballX = 120, holdUntil = 0, held = false;
    const addPlay = html => { const li = document.createElement('li'); li.innerHTML = html; plays.prepend(li); while (plays.children.length > 4) plays.lastChild.remove(); };
    const finish = () => {
      if (done) return; done = true; cancelAnimationFrame(raf);
      for (; idx < game.events.length; idx++) { const e = game.events[idx]; score[e.team] += e.pts; }
      scA.textContent = score[a]; scB.textContent = score[b];
      qEl.textContent = 'FINAL'; clockEl.textContent = '0:00';
      const w = score[a] > score[b] ? a : b;
      addPlay(`<b>Final: ${TEAM_BY_ABBR[w].name} win ${Math.max(score[a], score[b])}–${Math.min(score[a], score[b])}</b>`);
      ov.querySelectorAll('.bt')[w === a ? 0 : 1].classList.add('won');
      const btn = $('g-skip'); btn.textContent = 'Continue'; btn.className = 'btn'; btn.onclick = () => { ov.hidden = true; ov.innerHTML = ''; resolve(); };
      btn.focus();
    };
    $('g-skip').onclick = finish;
    if (!QMS) return finish();
    const tick = now => {
      const el = now - t0, q = Math.min(4, Math.floor(el / QMS) + 1), gameClock = Math.max(0, Math.round(900 - ((el % QMS) / QMS) * 900));
      qEl.textContent = names[q - 1]; clockEl.textContent = fmtClock(el >= QMS * 4 ? 0 : gameClock);
      while (idx < game.events.length) {
        const e = game.events[idx], at = (e.q - 1) * QMS + (1 - e.clock / 900) * QMS;
        if (el < at) break;
        score[e.team] += e.pts; scA.textContent = score[a]; scB.textContent = score[b];
        addPlay(`<span class="q">Q${e.q} ${fmtClock(e.clock)}</span> ${playText(e)}`);
        ballX = e.team === a ? 230 : 10; holdUntil = el + 450; held = true; idx++;
      }
      // ball drifts toward the end zone of whoever scores next; after a score it sits in the end zone briefly, then resets
      if (el < holdUntil) { /* hold */ }
      else if (held) { held = false; ballX = 120; }
      else {
        const next = game.events[idx];
        const goal = next ? (next.team === a ? 210 : 30) : 120;
        ballX = Math.max(25, Math.min(215, ballX + (goal - ballX) * 0.02 + (Math.random() - 0.5) * 1.5));
      }
      ball.setAttribute('cx', ballX.toFixed(1));
      if (el >= QMS * 4) return finish();
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  });
}
function finishBattle(winner) {
  const { attacker: a, defender: b } = turn, loser = winner === a ? b : a;
  const names = [...new Set(Object.keys(state.owners).filter(id => state.owners[id] === loser).map(id => STATE_OF[id] === 'DC' ? 'MD' : STATE_OF[id]))].map(c => CODE_TO_NAME[c]);
  const where = names.length <= 3 ? listJoin(names) : `${names.length} states`;
  state.owners = conquer(state.owners, winner, loser);
  const before = state.strengths[winner];
  state.strengths = boostWinner(state.strengths, winner, loser);
  const grew = state.strengths[winner] > before ? ` Strength ${before} → ${state.strengths[winner]} (beat a ${state.strengths[loser]}).` : '';
  addLog(`<b>${teamName(winner)}</b> beat the ${teamName(loser)} and take their land in ${where}.${grew}`);
  turn = { step: 'done', attacker: a, defender: b, winner, msg: `The <b>${TEAM_BY_ABBR[winner].name}</b> win and take over the ${teamName(loser)}' land in ${where}. The ${teamName(loser)} are out.${grew}` + afterMove() };
  syncStrengthInputs();
  nextTurnCount(); save(); paint(); render();
}

// ---------- turn panel ----------
function teamCard(abbr, pct, extra = '') {
  const t = TEAM_BY_ABBR[abbr];
  return `<div class="side-team ${extra}"><img src="${logoUrl(abbr)}" alt=""><span class="nm">${t.name}</span>${pct != null ? `<span class="pct">${Math.round(pct * 100)}%</span>` : ''}</div>`;
}
function render() {
  const st = $('status'), mu = $('matchup'), ac = $('actions');
  for (const b of document.querySelectorAll('.seg button')) b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode));
  mu.innerHTML = ''; ac.innerHTML = '';
  const btn = (label, fn, cls = '') => { const b = document.createElement('button'); b.className = `btn ${cls}`; b.textContent = label; b.disabled = busy; b.onclick = fn; ac.appendChild(b); return b; };
  const champ = champion(state.owners);
  if (champ) {
    const t = TEAM_BY_ABBR[champ];
    st.innerHTML = `<b>The ${t.name} rule America!</b> Last team standing after ${state.turn} turns.`;
    mu.innerHTML = `<div class="matchup" style="grid-template-columns:1fr">${teamCard(champ, null, 'win')}</div>`;
    btn('Reset map', doReset);
  } else if (turn.step === 'wheel') {
    st.innerHTML = busy ? 'Spinning…' : 'Spin the wheel to pick who attacks.';
    btn('Spin the wheel', spinWheel);
  } else if (turn.step === 'arrow') {
    st.innerHTML = busy ? 'Aiming…' : turn.missed
      ? `No land border that way. The <b>${TEAM_BY_ABBR[turn.attacker].name}</b> can only attack states they touch by land. Spin again.`
      : `The <b>${TEAM_BY_ABBR[turn.attacker].name}</b> are on the move. Spin the arrow to pick a direction.`;
    btn(turn.missed ? 'Spin again' : 'Spin the arrow', spinArrow);
  } else if (turn.step === 'battle') {
    const { attacker: a, defender: b } = turn, [pa, pb] = odds(a, b), showPct = state.mode !== 'pick';
    st.innerHTML = `The arrow points at ${regionName(BY_ID[turn.region])}. Battle!`;
    mu.innerHTML = `<div class="matchup">${teamCard(a, showPct ? pa : null)}<span class="vs">VS</span>${teamCard(b, showPct ? pb : null)}</div>`;
    if (state.mode === 'pick') {
      btn(`${teamName(a)} win`, () => finishBattle(a));
      btn(`${teamName(b)} win`, () => finishBattle(b));
    } else {
      btn('Fight!', fight);
    }
  } else if (turn.step === 'done') {
    st.innerHTML = turn.msg;
    if (turn.winner) mu.innerHTML = `<div class="matchup">${teamCard(turn.attacker, null, turn.winner === turn.attacker ? 'win' : '')}<span class="vs">VS</span>${teamCard(turn.defender, null, turn.winner === turn.defender ? 'win' : '')}</div>`;
    btn('Next turn', () => { turn = { step: 'wheel' }; clearAim(); render(); });
  }
  $('overlay').hidden = true;
}
// After every claim or battle: empty pockets a single team surrounds become theirs; the last team standing gets everything.
function afterMove() {
  let msg = '';
  const enclosed = enclosedClaims(state.owners, ADJ);
  const byTeam = {};
  for (const [id, t] of Object.entries(enclosed)) { state.owners = claim(state.owners, t, id); (byTeam[t] ||= []).push(regionName(BY_ID[id])); }
  for (const [t, names] of Object.entries(byTeam)) {
    addLog(`<b>${teamName(t)}</b> surround and take ${listJoin(names)}`);
    msg += ` The ${teamName(t)} surround ${listJoin(names)} and take ${names.length === 1 ? 'it' : 'them'} too.`;
  }
  const champ = champion(state.owners);
  if (champ) state.owners = fillAll(state.owners, champ);
  return msg;
}
const listJoin = a => a.length < 2 ? a.join('') : `${a.slice(0, -1).join(', ')} and ${a[a.length - 1]}`;
function nextTurnCount() { state.turn++; }

// ---------- side panels ----------
function drawStandings() {
  const counts = stateCounts(state.owners, STATE_OF);
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 6);
  $('standings').innerHTML = top.map(([a, n]) => `<li><img src="${logoUrl(a)}" alt=""><span>${TEAM_BY_ABBR[a].name}</span><span class="n">${n} ${n === 1 ? 'state' : 'states'}</span></li>`).join('');
}
function addLog(html, label = `Turn ${state.turn + 1}`) { state.log.unshift(`${label}: ${html}`); state.log = state.log.slice(0, 60); }
function drawLog() { $('log').innerHTML = state.log.length ? state.log.map(l => `<li>${l}</li>`).join('') : '<li>No moves yet.</li>'; }

function drawStrengths() {
  $('strengths').innerHTML = TEAMS.map(t => `<label><img src="${logoUrl(t.abbr)}" alt=""><span>${t.name}</span><input type="number" min="1" max="10" step="0.1" id="str-${t.abbr}" value="${state.strengths[t.abbr]}"></label>`).join('');
  for (const t of TEAMS) $(`str-${t.abbr}`).addEventListener('change', e => {
    const v = Math.max(1, Math.min(10, Math.round((+e.target.value || 1) * 10) / 10));
    e.target.value = v; state.strengths[t.abbr] = v; save(); render();
  });
}
function syncStrengthInputs() { for (const t of TEAMS) { const i = $(`str-${t.abbr}`); if (i) i.value = state.strengths[t.abbr]; } }
function drawAssign() {
  const s = $('assign');
  s.innerHTML = `<option value="">Off</option>` + TEAMS.map(t => `<option value="${t.abbr}">${t.name}</option>`).join('') + `<option value="__blank">Nobody (make it blank)</option>`;
  s.onchange = () => $('field').classList.toggle('assigning', !!s.value);
}
function onRegionClick(id) {
  const v = $('assign').value;
  if (!v || busy) return;
  const team = v === '__blank' ? null : v, before = state.owners[id];
  if (before === team) return;
  state.owners = claim(state.owners, team, id);
  addLog(`${regionName(BY_ID[id])} handed to <b>${team ? teamName(team) : 'nobody'}</b>`, 'By hand');
  const alive = new Set(aliveTeams(state.owners));
  if ((turn.attacker && !alive.has(turn.attacker)) || (turn.defender && turn.step === 'battle' && !alive.has(turn.defender))) { turn = { step: 'wheel' }; clearAim(); }
  else if (turn.step === 'arrow') drawArrow(turn.attacker, arrowRot);
  save(); paint(); render();
}

// ---------- state ----------
function fresh() {
  return { owners: initialOwners(REGIONS), strengths: Object.fromEntries(TEAMS.map(t => [t.abbr, t.strength])), mode: 'pick', log: [], turn: 0 };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE));
    // saved games from older versions may have extra regions (Alaska, Hawaii): keep only today's regions
    if (s && s.owners && REGIONS.every(r => r.id in s.owners)) return { ...fresh(), ...s, owners: Object.fromEntries(REGIONS.map(r => [r.id, s.owners[r.id]])) };
  } catch {}
  return fresh();
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {} }

let resetArmed = null;
function doReset() {
  state = fresh(); turn = { step: 'wheel' }; wheelRot = 0; arrowRot = 0;
  clearAim(); save(); drawStrengths(); paint(); render();
}

async function boot() {
  const topo = await (await fetch('states-10m.json')).json();
  const built = buildRegions(topo);
  REGIONS = built.regions;
  BY_ID = Object.fromEntries(REGIONS.map(r => [r.id, r]));
  STATE_OF = Object.fromEntries(REGIONS.map(r => [r.id, r.state]));
  CENT = Object.fromEntries(REGIONS.map(r => [r.id, r.at]));
  LABEL.fill(-1);
  REGIONS.forEach((r, i) => { for (const [x, y] of r.pts) for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) { const gx = x + dx, gy = y + dy; if (gx < W && gy < H) LABEL[gy * W + gx] = i; } });
  await Promise.all(TEAMS.map(t => new Promise(res => { const im = new Image(); im.onload = im.onerror = res; im.src = logoUrl(t.abbr); })));
  drawMap(built);
  state = load();
  $('loading').hidden = true;
  drawStrengths(); drawAssign();
  for (const b of document.querySelectorAll('.seg button')) b.onclick = () => { state.mode = b.dataset.mode; save(); render(); };
  $('reset').onclick = () => {
    const b = $('reset');
    if (resetArmed) { clearTimeout(resetArmed); resetArmed = null; b.textContent = 'Reset map'; b.className = 'btn ghost'; doReset(); return; }
    b.textContent = 'Click again to reset'; b.className = 'btn danger';
    resetArmed = setTimeout(() => { resetArmed = null; b.textContent = 'Reset map'; b.className = 'btn ghost'; }, 3000);
  };
  paint(); render();
}
boot().catch(err => { $('loading').textContent = `The map didn't load (${err.message}). Reload the page to try again.`; });

</script>
